name: ShearNet CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  shearnet-test:
    env:
      JAX_ENABLE_X64: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Run unit tests
        run: pytest tests/ -q -ra

      - name: Smoke run (train + evaluate)
        run: |
          shearnet-train --config configs/smoke.yaml --run runs/smoke
          shearnet-eval --config configs/smoke.yaml --run runs/smoke --estimator shearnet --output results/smoke/shearnet
          shearnet-eval --config configs/smoke.yaml --estimator ngmix --output results/smoke/ngmix
          shearnet-merge --shearnet results/smoke/shearnet/shearnet.fits --ngmix results/smoke/ngmix/ngmix.fits --output results/smoke/merged.fits
