name: ShearNet CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  shearnet-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
          # neither is on pypi: ngmix from github, and the JAX-GalSim fork
          # with des.DES_PSFEx (in-loop training and the evaluation need it)
          pip install git+https://github.com/esheldon/ngmix.git
          pip install "git+https://github.com/AdamField118/JAX-GalSim@0213d84"

      - name: Run unit tests
        run: pytest tests/ -q -ra

      - name: Smoke run (train + evaluate)
        run: |
          shearnet-train --config configs/smoke.yaml --run runs/smoke
          shearnet-eval --run runs/smoke
