# D4CNN baseline -- Lin, Li, Li, Cao, Liu & Wang (2026), arXiv:2603.19046.
#
# CALIBRATION IS POST HOC, settled by the paper. Section 2.1.2 and Figure 1:
# the response is the model gradient from backpropagation contracted with the
# ANALYTIC pixel shear response of the re-smoothed image (their Eq. 13-14),
#
#     R_ij = (de_i / df_h) . (df_h / dgamma_j),     gamma_i = e_i / R_i,
#
# applied to the trained model at measurement time. The training loss is plain
# Huber (delta = 1e-3); nothing in it knows about calibration. So this baseline
# is trained normally and calibrated by the benchmark, exactly like every other
# entry in the comparison.
#
# ------------------------------------------------------------------------
# THE INPUT DOMAIN IS NOT THE SAME AS SHEARNET'S -- read before comparing.
# ------------------------------------------------------------------------
# Their network sees f_h(x), the linear observable of their Eq. 3:
# deconvolve by the PSF, subtract a noise field deconvolved by the 90-degree
# rotated PSF, re-smooth with a Gaussian. It is PSF-homogenised BEFORE the
# network -- which is why their model needs no PSF branch, and why its PSF
# leakage is small almost by construction. ShearNet takes the observed stamp
# and the PSF stamp and is never deconvolved.
#
# So "D4CNN on ShearNet inputs" (what this config trains) and "the D4CNN of the
# paper" are different models, and only the first is a fair architecture-only
# comparison. Wiring their Eq. 3 in as a training input transform is not done
# here, because a half-applied transform (eval only) is worse than none.
#
# Also not matched: they train on the DC1 catalogue through xlens with LSST
# 10-year coadd depth, 64x64 stamps, orthogonal galaxy pairs, and brightness
# normalisation for bright galaxies. The dataset block below is ShearNet's, and
# is byte-identical to configs/baselines/forklens.yaml so the two models differ
# only in architecture.

# ---------------------------------------------------------------------------
# Matched-baseline dataset block. IDENTICAL in every configs/baselines/*.yaml:
# if these sections differ between two runs, the comparison measures the
# simulation rather than the architecture. Change them together or not at all.
# ---------------------------------------------------------------------------

schema_version: 1
run_options:
  run_name: baseline_d4cnn
simulation:
  noise_sigma: 0.001
  apply_psf_shear: true
  backend: jax-galsim
model:
  galaxy_branch: d4cnn
  psf_branch: d4cnn
  type: d4-fork-like
  output_keys: [g1, g2, hlr, flux]
  fusion: transformer
  branch_features: [32, 32, 32, 32, 32]
training:
  nobj: 200000
  epochs: 200
  batch_size: 256
  patience: 20
  loss: huber
