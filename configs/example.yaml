# A small, complete ShearNet config. Every key that can appear in a config is
# in shearnet/config/schema.py (and docs/config.md); anything left out takes its
# default, and a key that is not in the schema is an error.
#
#   shearnet-train --config configs/example.yaml --run runs/example
#   shearnet-eval  --run runs/example
schema_version: 1

run_options:
  run_name: example
  # outdir: runs/example     # relative paths resolve against this file
  ncores: null               # null: SLURM_CPUS_PER_TASK on a cluster, else 1

simulation:
  backend: jax-galsim        # galsim | jax-galsim (in-loop and eval need jax-galsim)
  pixel_scale: 0.141         # arcsec / pixel
  stamp_size: 53             # pixels
  noise_sigma: 1.0e-3        # Gaussian pixel noise, image counts
  gal_model: exp
  hlr_type: constant         # constant (0.5 arcsec) | catalog
  flux_type: constant        # constant (12258.97) | catalog
  psf:
    mode: ideal              # ideal (round Gaussian) | superbit (PSFEx)
    gaussian_fwhm: 0.5       # arcsec
  catalogs:
    train_file: null         # null draws a synthetic population (tests only)
    eval_file: null

model:
  type: fork-like
  galaxy_branch: research_backed
  psf_branch: forklens_psf
  fusion: concat
  output_keys: [g1, g2]

training:
  seed: 42
  nobj: 10000
  generation: upfront        # upfront | inloop
  epochs: 20
  batch_size: 64
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  patience: 10
  val_split: 0.2

evaluation:
  seed: 58
  nobj: 1000
  estimators: [shearnet, ngmix]
  rotations_deg: [0, 90]
  # scenes: the default is zero shear plus a +/-0.01 pair on each component
