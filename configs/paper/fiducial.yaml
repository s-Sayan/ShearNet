# ----------------------------------------------------------------------
# The fiducial ShearNet model on the fiducial SuperBIT simulation.
#
# Every paper arm (configs/paper/unit_tests, configs/paper/ablations) is this
# file with a small named set of keys changed; configs/paper/generate.py
# writes them. Edit this file or an arm's entry in that script, then re-run
# it -- never edit a generated arm by hand.
# ----------------------------------------------------------------------
schema_version: 1

run_options:
  run_name: fiducial
  outdir: /home/adfield/ShearNet/runs/fiducial
  description: shearnet-d4 with the D4-covariant relative 2D RoPE fusion encoding

simulation:
  backend: jax-galsim
  pixel_scale: 0.141
  stamp_size: 53
  noise_sigma: 12.719674
  hlr_type: catalog
  flux_type: catalog
  jax_fft_size: 256
  jax_batch_size: 128
  psf:
    mode: superbit
    psfex_file: /home/adfield/weak_lensing/superbit-lensing-jax-test/simulated_data/sim_utils/emp_psfs/emp_psfs_best/psfex_all_except_best
  catalogs:
    train_file: /home/adfield/ShearNet/cosmos_catalog_nocut_train.fits
    eval_file: /home/adfield/ShearNet/cosmos_catalog_nocut_eval.fits

model:
  type: d4-fork-like
  fusion: transformer
  head: attention
  galaxy_branch: shearnet-d4
  psf_branch: shearnet-d4
  output_keys: [g1, g2, hlr, flux]

  # The observation is galaxy (*) PSF, so the PSF's contribution at p depends
  # only on the offset p - p'. That fixes the fusion's positional encoding to be
  # relative and to act on queries and keys; D4 covariance then forces the x-
  # and y-pairs of each channel group to share a frequency. The frequencies are
  # set by the extent of the 13x13 map (one to three cycles), not by a text
  # model's base-10000 schedule. tests/test_models.py pins all three properties.
  fusion_pos: rope2d

  # `design` names the published specification -- branches, fusion and heads
  # together -- so swapping the backbone in an ablation swaps only the backbone.
  design: shearnet-d4
  d_model: 64
  num_heads: 4
  num_self_attn_layers: 1
  ffn_dim: 256              # Sec. 7.2; 0 is the attention-only block
  num_pool_heads: 4         # head: attention

  # The report's schedule is features [32, 48, 64], galaxy depths [2, 2, 1],
  # PSF depths [1, 1, 1]. Every trim below is at the full 53x53 stage, which is
  # where the activations are (the orbit multiplies each block there by eight).
  # Measured on this config's fused step, fp32, batch 128, all six response
  # terms on, orbit_k 4:
  #
  #                                        MB/sample    GB at batch 128
  #   as it OOMed                             4468.9        572.0
  #   + orbit_scan                             456.2         58.4
  #   + response.batch 32 of 128               114.5         14.7
  #   + the schedule below                      75.9          9.7
  d4_features: [16, 48, 64]
  d4_depths_galaxy: [1, 2, 1]
  d4_depths_psf: [0, 1, 1]
  # The eight-element orbit as a rematerialised scan: same parameters, outputs
  # equal to float reassociation (7e-07), 7.8x less activation memory.
  orbit_scan: true

training:
  seed: 42
  nobj: 300000
  generation: inloop
  epochs: 60
  batch_size: 128
  learning_rate: 1.0e-4
  weight_decay: 1.0e-2
  patience: 10
  val_split: 0.2
  eval_interval: 1
  loss_weights: [1.0, 1.0, 1.0, 1.0]
  ema_decay: 0.999
  normalize_images: true

  response:
    gamma_weight: 1.0e-2
    psf_weight: 1.0e-1
    shift_weight: 1.0e-2
    # damps directions orthogonal to every physical image tangent, without
    # touching the tangents themselves
    complement_weight: 1.0e-3
    # re-renders only the PSF at 90 degrees: a simulator constraint, distinct
    # from the joint D4 symmetry of the architecture
    orbit_weight: 1.0e-2
    # (R11 - R22)^2 + (R12 + R21)^2 on R^gamma, the one thing D4 equivariance
    # structurally cannot give (it zeroes the off-diagonals and leaves R11 and
    # R22 unrelated). Reuses the R^gamma matrix gamma_weight builds.
    isotropy_weight: 1.0e-2
    # the response block is ~90% of a step; every 4th step is -35% per epoch
    every_n_steps: 4
    # K=4 reaches the spin-4 term eps^2 conj(gamma) that K=2 cannot; with the
    # orbit on 32 objects it costs runtime, not memory
    orbit_k: 4
    gamma_target: analytic
    # every response term is an ensemble 2x2 matrix, so 32 of 128 objects only
    # doubles its standard error; the supervised loss still sees all 128
    batch: 32
    report: true

evaluation:
  seed: 150
  # whole 15-orientation rings of the catalog
  nobj: 199995
  estimators: [shearnet, ngmix]
  batch_size: 256
  # pair-matched: same galaxies, offsets, PSFs and noise in every scene
  scenes:
    - {name: zero, g1: 0.0, g2: 0.0}
    - {name: g1_plus, g1: 0.01, g2: 0.0}
    - {name: g1_minus, g1: -0.01, g2: 0.0}
    - {name: g2_plus, g1: 0.0, g2: 0.01}
    - {name: g2_minus, g1: 0.0, g2: -0.01}
  # (0, 90) cancels the intrinsic shape; 45 also flips the sign of the
  # O(eps^2 g) term in the +/- difference, which 90 cannot touch
  rotations_deg: [0, 45, 90, 135]
  metacal:
    psf: dilate
    step: 0.01
    shearnet: true
  ngmix:
    gal_model: gauss
    psf_model: gauss
