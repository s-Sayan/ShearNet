# ----------------------------------------------------------------------
# UT1: ideal Gaussian PSF, fixed size and flux
# ----------------------------------------------------------------------
#
# Changed from UT4, the fiducial simulation:
#   simulation.psf.mode             ->  'ideal'
#   simulation.hlr_type             ->  'constant'
#   simulation.flux_type            ->  'constant'
#   training.response.orbit_weight  ->  0.0
#
# Why:
# Shear recovery in isolation. The PSF is a circular Gaussian of
# 0.5 arcsec FWHM and every galaxy has the same half-light radius and flux, so
# the only thing varying across the population is the intrinsic shape and the
# applied shear. A bias here is a bias in the estimator itself and cannot be
# blamed on the PSF model or on the size-flux distribution.
#
# Read this before trusting the result:
# The PSF orbit penalty is off at this rung and only at this
# rung, because an ideal circular PSF makes it vacuous. Every other response term
# is unchanged, so UT1 is still the same objective as UT2-UT4 in everything that
# can act.
#
# hlr and flux are constant here while `output_keys` still asks
# for them. That is deliberate -- the network must be identical across the ladder
# -- and it is safe: fit_normalizer guards a zero standard deviation (it
# substitutes 1.0), so the auxiliary targets contribute a constant term rather
# than a division by zero. They are simply trivial to predict at this rung.
# ----------------------------------------------------------------------
schema_version: 1
run_options:
  run_name: d4_unit_first
  outdir: /home/adfield/ShearNet/runs/unit_tests/first
  description: 'UT1: ideal Gaussian PSF, fixed size and flux'
simulation:
  backend: jax-galsim
  pixel_scale: 0.141
  stamp_size: 53
  noise_sigma: 12.719674
  hlr_type: constant
  flux_type: constant
  jax_fft_size: 256
  jax_batch_size: 128
  psf:
    mode: ideal
    psfex_file: /home/adfield/weak_lensing/superbit-lensing-jax-test/simulated_data/sim_utils/emp_psfs/emp_psfs_best/psfex_all_except_best
  catalogs:
    train_file: /home/adfield/SHEARNET_DATA/cosmos_catalog_train.fits
    eval_file: /home/adfield/SHEARNET_DATA/cosmos_catalog_eval.fits
model:
  type: d4-fork-like
  fusion: transformer
  head: attention
  galaxy_branch: shearnet-d4
  psf_branch: shearnet-d4
  output_keys: [g1, g2, hlr, flux]
  fusion_pos: rope2d
  design: shearnet-d4
  d_model: 64
  num_heads: 4
  num_self_attn_layers: 1
  ffn_dim: 256
  num_pool_heads: 4
  d4_features: [16, 48, 64]
  d4_depths_galaxy: [1, 2, 1]
  d4_depths_psf: [0, 1, 1]
  orbit_scan: true
training:
  seed: 42
  nobj: 300000
  generation: inloop
  epochs: 60
  batch_size: 128
  learning_rate: 0.0001
  weight_decay: 0.01
  patience: 10
  val_split: 0.2
  eval_interval: 1
  loss_weights: [1.0, 1.0, 1.0, 1.0]
  ema_decay: 0.999
  normalize_images: true
  response:
    gamma_weight: 0.01
    psf_weight: 0.1
    shift_weight: 0.01
    complement_weight: 0.001
    orbit_weight: 0.0
    isotropy_weight: 0.01
    every_n_steps: 4
    orbit_k: 4
    gamma_target: analytic
    batch: 32
    report: true
evaluation:
  seed: 150
  nobj: 199995
  estimators: [shearnet, ngmix]
  batch_size: 256
  scenes:
  - name: zero
    g1: 0.0
    g2: 0.0
  - name: g1_plus
    g1: 0.01
    g2: 0.0
  - name: g1_minus
    g1: -0.01
    g2: 0.0
  - name: g2_plus
    g1: 0.0
    g2: 0.01
  - name: g2_minus
    g1: 0.0
    g2: -0.01
  rotations_deg: [0, 45, 90, 135]
  metacal:
    psf: dilate
    step: 0.01
    shearnet: true
  ngmix:
    gal_model: gauss
    # LITB III's PSF model: a five-Gaussian EM mixture. With one Gaussian the
    # SuperBIT PSFEx profiles are not represented, ngmix's R^PSF stops
    # describing its leakage and the R^PSF correction overcorrects.
    psf_model: em5
