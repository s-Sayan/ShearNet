# ----------------------------------------------------------------------
# UT4: the fiducial simulation
# ----------------------------------------------------------------------
#
# The fiducial simulation:
#   simulation.psf.mode   ->  'superbit'
#   simulation.hlr_type   ->  'catalog'
#   simulation.flux_type  ->  'catalog'
#
# Why:
# Adds the catalog flux distribution, so size and signal-to-noise
# now vary jointly as they do in the COSMOS detection sample. This is the
# population every headline number in the paper is measured on, and it is the same
# simulation the fiducial model trains on.
# ----------------------------------------------------------------------
schema_version: 1
run_options:
  run_name: d4_unit_fourth
  outdir: ../../../runs/unit_tests/fourth
  description: 'UT4: the fiducial simulation'
simulation:
  backend: jax-galsim
  pixel_scale: 0.141
  stamp_size: 53
  noise_sigma: 12.719674
  hlr_type: catalog
  flux_type: catalog
  jax_fft_size: 256
  jax_batch_size: 128
  psf:
    mode: superbit
    psfex_file: /home/adfield/weak_lensing/superbit-lensing-jax-test/simulated_data/sim_utils/emp_psfs/emp_psfs_best/psfex_all_except_best
  catalogs:
    train_file: /home/adfield/SHEARNET_DATA/cosmos_catalog_train.fits
    eval_file: /home/adfield/SHEARNET_DATA/cosmos_catalog_eval.fits
model:
  type: d4-fork-like
  fusion: transformer
  head: attention
  galaxy_branch: shearnet-d4
  psf_branch: shearnet-d4
  output_keys: [g1, g2, hlr, flux]
  fusion_pos: rope2d
  design: shearnet-d4
  d_model: 64
  num_heads: 4
  num_self_attn_layers: 1
  ffn_dim: 256
  num_pool_heads: 4
  d4_features: [16, 48, 64]
  d4_depths_galaxy: [1, 2, 1]
  d4_depths_psf: [0, 1, 1]
  orbit_scan: true
training:
  seed: 42
  nobj: 300000
  generation: inloop
  epochs: 60
  batch_size: 128
  learning_rate: 0.0001
  weight_decay: 0.01
  patience: 10
  val_split: 0.2
  eval_interval: 1
  loss_weights: [1.0, 1.0, 1.0, 1.0]
  ema_decay: 0.999
  normalize_images: true
  response:
    gamma_weight: 0.01
    psf_weight: 0.1
    shift_weight: 0.01
    complement_weight: 0.001
    orbit_weight: 0.01
    isotropy_weight: 0.01
    every_n_steps: 4
    orbit_k: 4
    gamma_target: analytic
    batch: 32
    report: true
evaluation:
  seed: 150
  nobj: 199995
  estimators: [shearnet, ngmix]
  batch_size: 256
  scenes:
  - name: zero
    g1: 0.0
    g2: 0.0
  - name: g1_plus
    g1: 0.01
    g2: 0.0
  - name: g1_minus
    g1: -0.01
    g2: 0.0
  - name: g2_plus
    g1: 0.0
    g2: 0.01
  - name: g2_minus
    g1: 0.0
    g2: -0.01
  rotations_deg: [0, 45, 90, 135]
  metacal:
    psf: dilate
    step: 0.01
    shearnet: true
  ngmix:
    gal_model: gauss
    # LITB III's PSF model: a five-Gaussian EM mixture. With one Gaussian the
    # SuperBIT PSFEx profiles are not represented, ngmix's R^PSF stops
    # describing its leakage and the R^PSF correction overcorrects.
    psf_model: em5
