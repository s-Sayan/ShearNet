# fourth_forklens
#
# ForkLens baseline on the fourth task: the same two-branch topology with the
# equivariance removed, no response terms, and the same dataset, seeds and
# training budget as `fourth_shearnet_control`.
#
# Three arms span the two axes that matter, each differing from the next in one
# thing only:
#
#     fourth_forklens           equivariant: no    response: no
#     fourth_shearnet_control   equivariant: yes   response: no
#     fourth_inloop_shearnet    equivariant: yes   response: yes  (orbit_k 2, every_n_steps 2)
#     fourth_shearnet_k4        equivariant: yes   response: yes  (orbit_k 4, every_n_steps 1)
#
# So `forklens -> control` prices the equivariance and `control -> shearnet`
# prices the response terms, with no third change confounding either step.
#
# A separate D4CNN arm is deliberately absent: on this task it would be the same
# architecture as `fourth_shearnet_control` (`d4-fork-like`) differing only in
# hyperparameters, so it would mostly restate that column. The D4CNN of Lin et
# al. is a different comparison -- its network input is the PSF-homogenised
# `f_h`, not a raw stamp -- and that belongs in a run that changes the input
# contract, not the architecture.
#
#     sbatch scripts/shearnet.sbatch configs/variations/fourth_forklens.yaml
#
# fork-like does not accept model.head.

schema_version: 1
run_options:
  run_name: fourth_forklens
  description: superbit PSF; g1, g2, hlr, flux from catalog; constant noise
  outdir: /home/adfield/ShearNet/runs/variations/fourth_forklens
simulation:
  psf:
    mode: superbit
    psfex_file: /home/adfield/SHEARNET_DATA/psfex-output/Abell3411_1_300_1684688714_clean_starcat.psf
  noise_sigma: 12.719674
  hlr_type: catalog
  flux_type: catalog
  backend: jax-galsim
  jax_batch_size: 128
  catalogs:
    train_file: /home/adfield/ShearNet/cosmos_catalog_train.fits
    eval_file: /home/adfield/ShearNet/cosmos_catalog_eval.fits
model:
  type: fork-like
  output_keys: [g1, g2, hlr, flux]
  gap: true
  fusion: transformer
training:
  nobj: 300000
  normalize_images: true
  generation: inloop
  epochs: 60
  batch_size: 128
  learning_rate: 0.0001
  weight_decay: 0.01
  loss_weights: [1.0, 1.0, 1.0, 1.0]
  ema_decay: 0.999
  response:
    report: true
evaluation:
  nobj: 200000
  seed: 150
  scenes:
  - name: zero
    g1: 0.0
    g2: 0.0
  - name: g1_plus
    g1: 0.01
    g2: 0.0
  - name: g1_minus
    g1: -0.01
    g2: 0.0
  metacal:
    shearnet: false
  batch_size: 256
