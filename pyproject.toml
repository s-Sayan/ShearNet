[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shearnet"
version = "0.1.0"
authors = [
    {name = "Sayan Saha", email = "sayan.iiserp@gmail.com"},
]
description = "Neural network-based galaxy shear estimation with JAX"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
keywords = ["astronomy", "machine-learning", "galaxy", "shear-estimation", "jax"]

dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0", 
    "flax>=0.7.0",
    "optax>=0.1.0",
    "orbax-checkpoint==0.11.20",
    "galsim>=2.3",
    # ngmix itself is installed from github (it isnt on pypi) and doesnt
    # declare numba, so it has to be declared here
    "numba>=0.57.0",
    "numpy>=1.20",
    "scipy>=1.7",
    "matplotlib>=3.5",
    "tqdm>=4.60",
    "pyyaml>=5.4",
    # catalogs in, evaluation catalogs out
    "astropy>=5.0",
]

[project.optional-dependencies]
# GPU support (CUDA 12 only)
gpu = [
    "jax[cuda12]>=0.4.0",  # GPU version with CUDA 12
]

# what CI installs: pytest plus the static checks the suite runs
test = [
    "pytest>=7.0",
    "pyflakes>=3.0",
]

dev = [
    "shearnet[test]",
    "pytest-cov>=3.0",
    "black>=22.0",
    "flake8>=4.0",
    "isort>=5.0",
    "ipython>=8.0",
    "ipdb>=0.13",
    "jupyter>=1.0",
    "pympler>=1.0",  # methods.ngmix.get_memory_usage
]

# AnaCal supplies the FPFS reference estimator for the research benchmarks and
# nothing else, so it stays optional. Pinned at >=0.8: the harness calls
# anacal.fpfs.process_image with a forced `detection` catalogue and reads the
# fpfs1_de*_dg* response columns, and neither is guaranteed on earlier releases.
calibration = [
    "anacal>=0.8",
]
[project.urls]
Homepage = "https://github.com/s-Sayan/ShearNet"
Repository = "https://github.com/s-Sayan/ShearNet.git"

[project.scripts]
shearnet-train = "shearnet.cli.train:main"
shearnet-eval = "shearnet.cli.evaluate:main"

[tool.setuptools.packages.find]
include = ["shearnet*"]
exclude = ["research*", "tests*", "notebooks*"]

[tool.setuptools.package-data]
shearnet = ["config/*.yaml", "py.typed"]

[tool.pytest.ini_options]
markers = [
    "slow: benchmark-harness tests that fit ngmix models (tens of seconds)",
]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 100
