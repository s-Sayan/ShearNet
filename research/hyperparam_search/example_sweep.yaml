# Example hyperparameter sweep.
#
#   python research/hyperparam_search/sweep.py --sweep research/hyperparam_search/example_sweep.yaml --write
#   sbatch --array=0-35%8 scripts/shearnet.sbatch --list research/hyperparam_search/sweep_out/runs.txt
#   python research/hyperparam_search/sweep.py --sweep research/hyperparam_search/example_sweep.yaml --collect
#
# Each run is ranked by its best validation loss. Start from a light base config
# (few samples/epochs) to find promising regions, then re-run the winners at
# full scale.

base_config: ../../configs/smoke.yaml   # relative to this file
method: grid                            # "grid" (full product) or "random"
n_samples: 12                           # random only
seed: 0                                 # random only
name_prefix: sweep

grid:
  training.learning_rate: [1.0e-3, 5.0e-4, 1.0e-4]
  training.batch_size: [32, 64, 128]
  training.weight_decay: [1.0e-4, 1.0e-5]
  training.ema_decay: [null, 0.999]
