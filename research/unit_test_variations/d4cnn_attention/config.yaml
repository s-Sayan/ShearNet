meta:
  model_name: d4cnn_attention_control
  description: "superbit PSF; g1, g2, hlr, flux from catalog; constant noise"

paths:
  root: /home/adfield/ShearNet/research/unit_test_variations/d4cnn_attention
  psfex_model_file: /home/adfield/SHEARNET_DATA/psfex-output/Abell3411_1_300_1684688714_clean_starcat.psf
  train_catalog: /home/adfield/ShearNet/cosmos_catalog_train.fits
  eval_catalog:  /home/adfield/ShearNet/cosmos_catalog_eval.fits
  checkpoint_dir: null      # null -> $SHEARNET_DATA_PATH/model_checkpoint
  plot_dir:       null      # null -> $SHEARNET_DATA_PATH/plots

image:
  stamp_size: 53
  pixel_scale: 0.141
  noise_sd: 12.719674
  normalize_images: true

psf:
  mode: superbit            # superbit = PSFEx file above | ideal = analytic Gaussian
  gaussian_fwhm: 0.5        # only used when mode: ideal
  stamp_size: 53            # psf_npix
  noise: 1.0e-6             # consumed by the bias test;

galaxy:
  hlr_type:  catalog        # constant | catalog
  flux_type: catalog        # constant | catalog
  hlr:  0.5                 # value used when *_type is constant
  flux: 12258.97

model:
  architecture: d4-fork-like
  process_psf: true
  fusion: transformer                   # concat | transformer
  head: attention
  # D4 branch backbones (all choices stay D4-equivariant via orbit averaging):
  #   d4cnn (smooth default) | research_backed | forklens_psf
  galaxy_branch: d4cnn
  psf_branch:    d4cnn
  output_keys: [g1, g2, hlr, flux]
  gap: true

train:
  seed: 42
  samples: 500000
  epochs: 80
  batch_size: 128
  learning_rate: 1.0e-4
  weight_decay:  1.0e-2
  patience: 20
  val_split: 0.2
  eval_interval: 1
  loss_weights: [1.0, 1.0, 1.0, 1.0]   # one per output_key, in order
  ema_decay: 0.999
  plot: true

eval:
  seed: 150
  n_obs: 350000
  include_shearnet: true     # load ShearNet next to ngmix (bias test may set false for a pure-ngmix baseline)
  gal_model: gauss           # ngmix galaxy fit model

  bias:                      # shear-bias / metacal
    psf_model: gauss         # ngmix PSF fit model
    n_jackknife: 20
    shear_true: 0.01
    # PSF-response correction method (applies to BOTH ngmix and ShearNet; an
    # uncorrected "raw" copy of each is always kept as *_raw / g_sn_raw):
    #   none    -> no correction
    #   metacal -> deconvolve/dilate/reconvolve metacal PSF response (ngmix's
    #              native mode; forces ShearNet through the metacal images too)
    #   direct  -> skip-deconvolution: shear the REAL PSF by +/- step, reconvolve
    #              the galaxy (the physical response for a non-deconvolving net)
    psf_response: metacal
    psf_response_step: 0.01  # shear step, shared by metacal AND direct
    # ShearNet inference micro-batch. The D4 model + transformer fusion attention
    # is O(tokens^2); research_backed (27x27) OOMs at large batches. 64 is safe;
    # raise for d4cnn branches or a smaller GPU footprint.
    shearnet_batch_size: 64
    output: benchmarking/m/metacal_results.fits

  leakage:                   # PSF leakage
    psf_model: em5
    psf_response: metacal    # none | metacal | direct  (see eval.bias for details)
    psf_response_step: 0.01  # shear step, shared by metacal AND direct
    shearnet_batch_size: 64  # see eval.bias (O(tokens^2) fusion; avoids GPU OOM)
    output: benchmarking/psf_leakage/psf_leakage_results.fits

  timing:                    # ngmix vs ShearNet speed
    psf_model: em5
    n_warmup: 20
    shearnet_batch_size: 512
    nproc: null              # null -> SLURM_CPUS_PER_TASK
    output: timing/timing_results.npz
