meta:
  model_name: fourth_inloop_shearnet
  description: "D4 ShearNet with in-loop rendering, depth resampling, and response losses"

paths:
  root: /home/adfield/ShearNet/research/unit_test_variations/fourth_inloop_shearnet
  psfex_model_file: /home/adfield/SHEARNET_DATA/psfex-output/Abell3411_1_300_1684688714_clean_starcat.psf
  train_catalog: /home/adfield/ShearNet/cosmos_catalog_train.fits
  eval_catalog: /home/adfield/ShearNet/cosmos_catalog_eval.fits
  checkpoint_dir: null
  plot_dir: null

image:
  stamp_size: 53
  pixel_scale: 0.141
  noise_sd: 12.719674
  normalize_images: true

psf:
  mode: superbit
  gaussian_fwhm: 0.5
  stamp_size: 53
  noise: 1.0e-6

galaxy:
  hlr_type: catalog
  flux_type: catalog
  hlr: catalog
  flux: catalog

model:
  architecture: d4-fork-like
  process_psf: true
  fusion: transformer
  head: attention
  # The smooth branches retain differentiability for the response losses.
  galaxy_branch: d4cnn
  psf_branch: d4cnn
  branch_features: [32, 32, 32, 32, 32]
  output_keys: [g1, g2, hlr, flux]
  gap: true
  dropout: 0.0

train:
  seed: 42
  samples: 300000
  epochs: 60
  # This is both the render and optimizer batch size in the fused step.
  batch_size: 128
  learning_rate: 1.0e-4
  weight_decay: 1.0e-2
  patience: 10
  val_split: 0.2
  eval_interval: 1
  loss_weights: [1.0, 1.0, 1.0, 1.0]
  ema_decay: 0.999
  plot: true

  backend: jax-galsim
  generation: inloop
  jax_fft_size: 256
  jax_batch_size: 128

  response:
    gamma_weight: 1.0e-2
    psf_weight: 1.0e-1
    shift_weight: 1.0e-2
    # The complement is the protected-subspace penalty: it damps directions
    # orthogonal to all physical image tangents without changing those tangents.
    complement_weight: 1.0e-3
    # Re-rendering only the PSF at 90 degrees is a simulator constraint. It is
    # distinct from the joint D4 symmetry implemented by the architecture.
    orbit_weight: 1.0e-2
    every_n_steps: 2
    orbit_k: 2
    gamma_target: analytic
    report: true

  noise:
    min_sd: null
    max_sd: null
    condition: false

eval:
  seed: 150
  n_obs: 200000
  gal_model: gauss

  evaluate:
    # ShearNet is always in the run -- a benchmark of it alone says nothing --
    # so the only choice is which baseline it is measured against:
    #   ngmix   esheldon/ngmix. metacal + sim. ~1.2 h at n_obs 200000 on 18
    #           workers, and the baseline the field reads.
    #   anacal  AnaCal's own C++ Gaussian model fit, which carries an ANALYTIC
    #           de/dgamma out of the fit via quintuple numbers (Li 2026,
    #           arXiv:2506.16607). Not a wrapper around ngmix. Its fit is
    #           SERIAL at ~12.6 ms/object, so it adds ~7 h at n_obs 200000.
    #   both    run the pair.
    # Override on the command line with --baseline; the preflight prints the
    # hours before the run commits to them.
    baseline: ngmix

    # Corrections, all measured, no switch to turn any off:
    #   metacal  shear the IMAGE (ngmix's bootstrapper); ShearNet measures the
    #            same five reconvolved stamps
    #   anacal   the ANALYTIC response, exact rather than a finite difference,
    #            available only for AnaCal's own fit
    #   sim      shear the SCENE -- re-render at gamma +/- response_step with
    #            galaxies, PSFs and noise pinned. The universal one, and the
    #            anacal row is what says whether it agrees with the exact answer.
    response_step: 0.01        # shared, so the responses are comparable
    shear_true: 0.01
    component: 0               # which component carries the applied shear
    n_jackknife: 20
    psf_model: gauss           # ngmix PSF model
    c_convention: shearnet     # 'lin2026' to sit beside their Eq. 23
    resample: jackknife        # 'bootstrap' to match their 20x bootstrap
    # AnaCal model fit. The window is what the fitter cuts around each source,
    # so an odd 53-pixel stamp needs no padding. ~12.6 ms/object and not
    # parallelised (see shearnet/methods/anacal_fit.py for why), so budget
    # ~4.2 h at n_obs 200000.
    anacal_sigma_arcsec: 0.52
    anacal_stamp_size: 32
    anacal_epochs: 35
    shearnet_batch_size: 256

    # ngmix worker processes. null = the SLURM allocation (1 off-cluster).
    # metacal is ~156 ms/object against ~7 ms for a plain fit, so this is the
    # difference between ~20 hours on one core and ~1.2 hours on 18. The value
    # used is recorded in the FITS header: metacal's random guesses depend on
    # the worker count, so reproducing an m bit-for-bit means reproducing this.
    ngmix_nproc: null

    # One file, every time. TAB_P / TAB_M are the +/- shear populations one row
    # per object, LEAKAGE is the unsheared population with R^PSF, SUMMARY is one
    # row per (estimator, correction). research/shear_bias/plots_from_fits.ipynb
    # reads exactly this.
    output: benchmarking/evaluation.fits
