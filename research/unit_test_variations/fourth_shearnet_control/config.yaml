meta:
  model_name: shearnet_control
  description: "superbit PSF; g1, g2, hlr, flux from catalog; constant noise"

paths:
  root: /home/adfield/ShearNet/research/unit_test_variations/fourth_shearnet_control
  psfex_model_file: /home/adfield/SHEARNET_DATA/psfex-output/Abell3411_1_300_1684688714_clean_starcat.psf
  train_catalog: /home/adfield/ShearNet/cosmos_catalog_train.fits
  eval_catalog:  /home/adfield/ShearNet/cosmos_catalog_eval.fits
  checkpoint_dir: null
  plot_dir:       null

image:
  stamp_size: 53
  pixel_scale: 0.141
  noise_sd: 12.719674
  normalize_images: true

psf:
  mode: superbit
  gaussian_fwhm: 0.5
  stamp_size: 53
  noise: 1.0e-6

galaxy:
  hlr_type:  catalog
  flux_type: catalog
  hlr:  0.5
  flux: 12258.97

model:
  # THIS is ShearNet's D4-equivariant architecture. `d4-fork-like` is the
  # registry name of the two-branch model whose branches are D4-equivariant by
  # construction (Reynolds averaging over the eight square symmetries with the
  # spin-2 sign weights of Lin et al. 2026 Eqs. 25-26), not a separate baseline.
  # Setting both branches to `d4cnn` is what makes the equivariance real:
  # `process_psf: true` feeds the PSF through its own equivariant branch, so a
  # rotation applied to the galaxy AND its PSF rotates the prediction, which is
  # the PSF-equivariance half of the claim.
  architecture: d4-fork-like
  process_psf: true
  fusion: transformer
  head: attention
  galaxy_branch: d4cnn
  psf_branch:    d4cnn
  # Lin et al. (2026) Table 1: five layers at base width 32. The package default
  # is the two-layer (16, 32) proof of concept, so fourth is quietly running a
  # smaller backbone than the architecture it is named for.
  branch_features: [32, 32, 32, 32, 32]
  output_keys: [g1, g2, hlr, flux]
  gap: true
  # dropout is a genuine no-op for d4cnn branches -- only `research_backed`
  # consumes it -- so it is left off rather than set for appearance.
  dropout: 0.0

train:
  seed: 42
  samples: 300000
  epochs: 60
  # In-loop renders this many stamps inside the jitted step, so it is the render
  # batch as well as the optimiser batch. Memory scales as batch * fft_size^2;
  # if the response terms OOM, halve this before touching anything else.
  batch_size: 128
  learning_rate: 1.0e-4
  weight_decay:  1.0e-2
  patience: 10
  val_split: 0.2
  eval_interval: 1
  loss_weights: [1.0, 1.0, 1.0, 1.0]
  ema_decay: 0.999
  plot: true
  # On-the-fly noise resampling is ON, and it is `generation: inloop` below that
  # turns it on: the noise field is drawn inside the jitted step from a key
  # folded on the step counter, so no galaxy is ever seen twice with the same
  # realisation and there is no finite noise dataset to memorise. The separate
  # `resample_noise` key is the up-front path's approximation of this and is a
  # no-op here, which is why it is not set.

  # --- the new machinery, everything else above is fourth's ---------------
  backend: jax-galsim
  generation: inloop
  jax_fft_size: 256
  jax_batch_size: 128        # keep equal to batch_size: one batch size, not two

  response:
    # Every weight 0.0 -- that is the ONE difference from fourth_shearnet. The
    # architecture, the in-loop renderer, the fresh noise, the seeds, the budget
    # and the eval block are identical, so the difference in m between the two
    # is attributable to the response terms and to nothing else.
    gamma_weight: 0.0
    psf_weight: 0.0
    shift_weight: 0.0
    complement_weight: 0.0
    orbit_weight: 0.0
    # Cadence and orbit size are inert with all weights at zero; they are left
    # at the cheap defaults rather than mirrored from the flagship, because
    # mirroring them would suggest they cost something here. They do not.
    every_n_steps: 1
    orbit_k: 2
    gamma_target: analytic
    report: true               # measure R even with no term driving it

  # base_shear_range stays at its 0.0 default and is NOT set here. The COSMOS
  # catalog shapes are real measured ellipticities -- they are already the
  # physical shape distribution -- so shearing them on top moves the training
  # population away from the realistic one. The response terms do not need it:
  # base_g1/base_g2 are differentiable handles whatever their value, so R^gamma
  # is well defined at gamma = 0, and the benchmark applies its own +/-0.01
  # anyway. The knob exists for one specific experiment -- checking that R^PSF
  # holds away from gamma = 0 -- and that is a separate run, not this one.

  # Depth conditioning is the ONE feature deliberately off. It is not the same
  # thing as the on-the-fly noise resampling above: resampling redraws the noise
  # at a FIXED depth, conditioning randomises the depth itself and rescales both
  # inputs by the draw. The trainer rejects it outright alongside
  # image.normalize_images: true, and turning it on would also change what this
  # run measures, since m would then be an average over depths rather than the
  # value at SuperBIT's. It belongs in its own run.
  noise:
    min_sd: null
    max_sd: null
    condition: false

eval:
  seed: 150
  n_obs: 200000
  include_shearnet: true
  gal_model: gauss

  bias:
    # Estimators to run. All three are calibrated by the SAME renderer-response
    # protocol (re-render the scene at gamma +/- response_step with the noise
    # held fixed, re-measure, central-difference), so the m values are directly
    # comparable. ngmix additionally reports its metacal response, and FPFS
    # additionally reports AnaCal's analytic one -- two independent checks that
    # the protocol is right.
    estimators: [shearnet, ngmix, fpfs]
    metacal: true              # also report ngmix calibrated by metacal
    fpfs_cross_check: true     # also report FPFS calibrated by the renderer protocol
    fpfs_sigma_shapelets: 0.52 # AnaCal sigma_shapelets1
    c_convention: shearnet     # 'lin2026' to sit beside their Eq. 23
    resample: jackknife        # 'bootstrap' to match their 20x bootstrap
    component: 0               # which component carries the applied shear (0 = g1)
    psf_model: gauss
    n_jackknife: 20
    shear_true: 0.01
    # ngmix worker processes. null = the SLURM allocation (1 off-cluster).
    # metacal is ~156 ms/object against ~7 ms for a plain fit, and this stage
    # runs the plain fit six times over the population (two shear populations
    # plus four response re-renders), so at n_obs 200000 this is the difference
    # between ~20 hours on one core and ~1.2 hours on 18. The value used is
    # recorded as ngmix_metacal_nproc in the output: metacal's random guesses
    # depend on the worker count, so reproducing an m bit-for-bit means
    # reproducing this too.
    ngmix_nproc: null
    psf_response: metacal
    psf_response_step: 0.01
    shearnet_batch_size: 256
    output: benchmarking/m/matched_bias.npz

  leakage:
    estimators: [shearnet, fpfs]
    fpfs_sigma_shapelets: 0.52
    n_jackknife: 20
    psf_model: em5
    psf_response: metacal
    psf_response_step: 0.01
    shearnet_batch_size: 256
    output: benchmarking/psf_leakage/matched_leakage.npz

  timing:
    psf_model: em5
    n_warmup: 20
    shearnet_batch_size: 512
    nproc: null
    output: timing/matched_timing.npz
