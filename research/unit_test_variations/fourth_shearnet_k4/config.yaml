meta:
  model_name: shearnet_k4
  description: "superbit PSF; g1, g2, hlr, flux from catalog; constant noise"

paths:
  root: /home/adfield/ShearNet/research/unit_test_variations/fourth_shearnet_k4
  psfex_model_file: /home/adfield/SHEARNET_DATA/psfex-output/Abell3411_1_300_1684688714_clean_starcat.psf
  train_catalog: /home/adfield/ShearNet/cosmos_catalog_train.fits
  eval_catalog:  /home/adfield/ShearNet/cosmos_catalog_eval.fits
  checkpoint_dir: null
  plot_dir:       null

image:
  stamp_size: 53
  pixel_scale: 0.141
  noise_sd: 12.719674
  normalize_images: true

psf:
  mode: superbit
  gaussian_fwhm: 0.5
  stamp_size: 53
  noise: 1.0e-6

galaxy:
  hlr_type:  catalog
  flux_type: catalog
  hlr:  0.5
  flux: 12258.97

model:
  # THIS is ShearNet's D4-equivariant architecture. `d4-fork-like` is the
  # registry name of the two-branch model whose branches are D4-equivariant by
  # construction (Reynolds averaging over the eight square symmetries with the
  # spin-2 sign weights of Lin et al. 2026 Eqs. 25-26), not a separate baseline.
  # Setting both branches to `d4cnn` is what makes the equivariance real:
  # `process_psf: true` feeds the PSF through its own equivariant branch, so a
  # rotation applied to the galaxy AND its PSF rotates the prediction, which is
  # the PSF-equivariance half of the claim.
  architecture: d4-fork-like
  process_psf: true
  fusion: transformer
  head: attention
  galaxy_branch: d4cnn
  psf_branch:    d4cnn
  # Lin et al. (2026) Table 1: five layers at base width 32. The package default
  # is the two-layer (16, 32) proof of concept, so fourth is quietly running a
  # smaller backbone than the architecture it is named for.
  branch_features: [32, 32, 32, 32, 32]
  output_keys: [g1, g2, hlr, flux]
  gap: true
  # dropout is a genuine no-op for d4cnn branches -- only `research_backed`
  # consumes it -- so it is left off rather than set for appearance.
  dropout: 0.0

train:
  seed: 42
  samples: 300000
  epochs: 60
  # In-loop renders this many stamps inside the jitted step, so it is the render
  # batch as well as the optimiser batch. Memory scales as batch * fft_size^2;
  # if the response terms OOM, halve this before touching anything else.
  batch_size: 128
  learning_rate: 1.0e-4
  weight_decay:  1.0e-2
  patience: 10
  val_split: 0.2
  eval_interval: 1
  loss_weights: [1.0, 1.0, 1.0, 1.0]
  ema_decay: 0.999
  plot: true
  # On-the-fly noise resampling is ON, and it is `generation: inloop` below that
  # turns it on: the noise field is drawn inside the jitted step from a key
  # folded on the step counter, so no galaxy is ever seen twice with the same
  # realisation and there is no finite noise dataset to memorise. The separate
  # `resample_noise` key is the up-front path's approximation of this and is a
  # no-op here, which is why it is not set.

  # --- the new machinery, everything else above is fourth's ---------------
  backend: jax-galsim
  generation: inloop
  jax_fft_size: 256
  jax_batch_size: 128        # keep equal to batch_size: one batch size, not two

  response:
    # UNTUNED starting values. Pick them so each term's logged value is
    # comparable to the supervised loss, not orders above it -- the per-epoch
    # "response terms:" line is the signal for that, and the R matrices in the
    # report line tell you whether the term is doing anything.
    gamma_weight: 1.0e-2       # drive R^gamma to the analytic per-object target
    psf_weight: 1.0e-1         # drive R^PSF to zero (zero is exactly correct)
    shift_weight: 1.0e-2       # a shape estimate must not depend on position
    complement_weight: 1.0e-3  # the protected-subspace (Hutchinson) term
    orbit_weight: 1.0e-2       # PSF-orbit consistency under shared noise
    # Cadence applies to ALL terms, not per term. 1 = every step, so every
    # gradient the optimiser takes carries the response signal and there is no
    # aliasing between the supervised and response gradients. This is the
    # expensive setting: measured on this backbone, the terms take the step from
    # 1.0x to ~15x the no-response step, and dropping to 2 recovers ~40% of that.
    # Lower it (and watch the logged "(N/M active steps)") if the run does not
    # fit; do not lower it silently, because the reported term values are then
    # averages over a subset of steps.
    every_n_steps: 1
    # 4 = {0, 45, 90, 135} degrees. K=2 already cancels the whole linear
    # (spin-2) PSF leakage, since eps^PSF -> -eps^PSF at 90 degrees; K=4 also
    # cancels the spin-4 term eps^2 conj(gamma), because sum exp(4 i theta)
    # vanishes over those four angles. It costs three extra renders + forwards
    # instead of one, which measured at only +13% on top of the other terms --
    # by far the cheapest of the remaining knobs, so it is on.
    #
    # Known caveats, specific to K=4 on superbit, both measured and both about
    # the 45/135 members only (90 degrees is exact to float32):
    #   1. a PSFEx model carries the pixel response of the stars it was fitted
    #      to, so rotating it 45 degrees rotates that implicit pixel too;
    #   2. resampling the interpolant off its own square support moves flux --
    #      up to ~1% per object, but zero-mean over the PSF population, so it
    #      is scatter rather than a systematic.
    # Neither invalidates the term: a correct shear estimate must not depend on
    # which PSF the galaxy was convolved with, realisable or not, and eps^PSF
    # still rotates by exactly theta, which is all the spin-4 cancellation
    # needs. But if the 45-degree members dominate the logged orbit value,
    # these are the things to suspect and orbit_k: 2 is the clean fallback.
    # Pinned by tests/test_inloop.py::test_orbit_rotates_an_empirical_psf_too.
    orbit_k: 4
    gamma_target: analytic     # 1 - eps^2 per object, not the ensemble identity
    report: true               # log R^gamma, R^PSF, R^shift every validation

  # base_shear_range stays at its 0.0 default and is NOT set here. The COSMOS
  # catalog shapes are real measured ellipticities -- they are already the
  # physical shape distribution -- so shearing them on top moves the training
  # population away from the realistic one. The response terms do not need it:
  # base_g1/base_g2 are differentiable handles whatever their value, so R^gamma
  # is well defined at gamma = 0, and the benchmark applies its own +/-0.01
  # anyway. The knob exists for one specific experiment -- checking that R^PSF
  # holds away from gamma = 0 -- and that is a separate run, not this one.

  # Depth conditioning is the ONE feature deliberately off. It is not the same
  # thing as the on-the-fly noise resampling above: resampling redraws the noise
  # at a FIXED depth, conditioning randomises the depth itself and rescales both
  # inputs by the draw. The trainer rejects it outright alongside
  # image.normalize_images: true, and turning it on would also change what this
  # run measures, since m would then be an average over depths rather than the
  # value at SuperBIT's. It belongs in its own run.
  noise:
    min_sd: null
    max_sd: null
    condition: false

eval:
  seed: 150
  n_obs: 200000
  gal_model: gauss

  evaluate:
    # ShearNet is always in the run -- a benchmark of it alone says nothing --
    # so the only choice is which baseline it is measured against:
    #   ngmix   esheldon/ngmix. metacal + sim. ~1.2 h at n_obs 200000 on 18
    #           workers, and the baseline the field reads.
    #   anacal  AnaCal's own C++ Gaussian model fit, which carries an ANALYTIC
    #           de/dgamma out of the fit via quintuple numbers (Li 2026,
    #           arXiv:2506.16607). Not a wrapper around ngmix. Its fit is
    #           SERIAL at ~12.6 ms/object, so it adds ~7 h at n_obs 200000.
    #   both    run the pair.
    # Override on the command line with --baseline; the preflight prints the
    # hours before the run commits to them.
    baseline: ngmix

    # Corrections, all measured, no switch to turn any off:
    #   metacal  shear the IMAGE (ngmix's bootstrapper); ShearNet measures the
    #            same five reconvolved stamps
    #   anacal   the ANALYTIC response, exact rather than a finite difference,
    #            available only for AnaCal's own fit
    #   sim      shear the SCENE -- re-render at gamma +/- response_step with
    #            galaxies, PSFs and noise pinned. The universal one, and the
    #            anacal row is what says whether it agrees with the exact answer.
    response_step: 0.01        # shared, so the responses are comparable
    shear_true: 0.01
    component: 0               # which component carries the applied shear
    n_jackknife: 20
    psf_model: gauss           # ngmix PSF model
    c_convention: shearnet     # 'lin2026' to sit beside their Eq. 23
    resample: jackknife        # 'bootstrap' to match their 20x bootstrap
    # AnaCal model fit. The window is what the fitter cuts around each source,
    # so an odd 53-pixel stamp needs no padding. ~12.6 ms/object and not
    # parallelised (see shearnet/methods/anacal_fit.py for why), so budget
    # ~4.2 h at n_obs 200000.
    anacal_sigma_arcsec: 0.52
    anacal_stamp_size: 32
    anacal_epochs: 35
    shearnet_batch_size: 256

    # ngmix worker processes. null = the SLURM allocation (1 off-cluster).
    # metacal is ~156 ms/object against ~7 ms for a plain fit, so this is the
    # difference between ~20 hours on one core and ~1.2 hours on 18. The value
    # used is recorded in the FITS header: metacal's random guesses depend on
    # the worker count, so reproducing an m bit-for-bit means reproducing this.
    ngmix_nproc: null

    # One file, every time. TAB_P / TAB_M are the +/- shear populations one row
    # per object, LEAKAGE is the unsheared population with R^PSF, SUMMARY is one
    # row per (estimator, correction). research/shear_bias/plots_from_fits.ipynb
    # reads exactly this.
    output: benchmarking/evaluation.fits
