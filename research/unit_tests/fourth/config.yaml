meta:
  model_name: d4_unit_fourth
  description: "superbit PSF; g1, g2, hlr, flux from catalog; constant noise"

paths:
  root: /home/adfield/ShearNet/research/unit_tests/fourth
  psfex_model_file: /home/adfield/SHEARNET_DATA/psfex-output/Abell3411_1_300_1684688714_clean_starcat.psf
  train_catalog: /home/adfield/ShearNet/cosmos_catalog_train.fits
  eval_catalog:  /home/adfield/ShearNet/cosmos_catalog_eval.fits
  checkpoint_dir: null
  plot_dir:       null

image:
  stamp_size: 53
  pixel_scale: 0.141
  noise_sd: 12.719674
  normalize_images: true

psf:
  mode: superbit
  gaussian_fwhm: 0.5
  stamp_size: 53
  noise: 1.0e-6

galaxy:
  hlr_type:  catalog
  flux_type: catalog
  hlr:  0.5
  flux: 12258.97

model:
  architecture: d4-fork-like
  process_psf: true
  fusion: transformer
  head: attention
  galaxy_branch: d4cnn
  psf_branch:    d4cnn
  output_keys: [g1, g2, hlr, flux]
  gap: true
  dropout: 0.0

train:
  seed: 42
  samples: 300000
  epochs: 60
  batch_size: 128
  learning_rate: 1.0e-4
  weight_decay:  1.0e-2
  patience: 10
  val_split: 0.2
  eval_interval: 1
  loss_weights: [1.0, 1.0, 1.0, 1.0]
  ema_decay: 0.999
  resample_noise: false
  plot: true

eval:
  seed: 150
  n_obs: 200000
  include_shearnet: true
  gal_model: gauss

  bias:
    psf_model: gauss
    n_jackknife: 20
    shear_true: 0.01
    psf_response: metacal
    psf_response_step: 0.01
    shearnet_batch_size: 256
    output: benchmarking/m/metacal_results.fits

  leakage:
    psf_model: em5
    psf_response: metacal
    psf_response_step: 0.01
    shearnet_batch_size: 256
    output: benchmarking/psf_leakage/psf_leakage_results.fits

  timing:
    psf_model: em5
    n_warmup: 20
    shearnet_batch_size: 512
    nproc: null
    output: timing/timing_results.npz