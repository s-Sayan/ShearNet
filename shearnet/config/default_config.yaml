# shearnet/config/default_config.yaml
# Default configuration for ShearNet

# Dataset configuration
dataset:
  samples: 10000
  # 0.5" FWHM. At pixel_size 0.141 this is ~3.5 px across; the previous 0.25
  # default was only ~1.8 px -- undersampled, and the one regime where galsim
  # and jax-galsim disagree (~5e-3) because of the pixel convolution. Every
  # unit-test config already sets 0.5 explicitly, so this changes no result.
  psf_fwhm: 0.5
  exp: "ideal"
  nse_sd: 1.0e-5
  seed: 42
  stamp_size: 53
  pixel_size: 0.141
  apply_psf_shear: false
  psf_shear_range: 0.05
  # Z-score standardization of the network outputs (labels: g1, g2, hlr, flux),
  # fit on the training portion only. Default true, matching historical behavior
  # (labels were always normalized). Set false to train on raw labels for the
  # label-normalization ablation; when off, an identity normalizer is saved so
  # eval and the benchmarks are unaffected.
  normalize_labels: true
  # Dataset-level input-image standardization (independent of label
  # normalization). When true, a single scalar mean/std per channel is fit on
  # the training stamps and reused at train/eval/benchmark time. Default false
  # so existing runs are unchanged; toggle for the A/B.
  normalize_images: false
  # D4 (8x) training augmentation -- ABLATION ONLY. Meaningful only for the
  # non-equivariant baselines (cnn / fork-like); a provable no-op for
  # d4-fork-like. Leave false unless running the augmentation-vs-architecture
  # ablation.
  d4_augment: false
  # Number of worker processes for dataset generation. null (default) = auto:
  # uses SLURM_CPUS_PER_TASK on a cluster, else 1 (serial) off-cluster. An
  # explicit int forces that many; 1 = serial. Uses a spawn-based pool
  # (JAX-safe, never fork). NOTE: auto reads the SLURM allocation, NOT the
  # node's total cores (os.cpu_count would oversubscribe a shared node). Output
  # is identical for any value (PSF sampling is seeded per object).
  nproc: null
  # Compute + store the 4 metacal (+/- e1/e2) reconvolved images per object.
  # Off by default; training never uses them (they only live in obs metadata).
  compute_metacal: false
  # Which renderer draws the stamps.
  #   galsim      -> shearnet.core.dataset (default, unchanged)
  #   jax-galsim  -> shearnet.core.dataset_jax: differentiable + batched
  #                  jit(vmap(...)) rendering. Every per-object random draw is
  #                  replicated from the galsim path (same RandomState(seed=i)
  #                  consumption order, same UniformDeviate for the PSFEx
  #                  file/position), so flipping this changes the renderer and
  #                  nothing else -- it is a true A/B.
  # exp: superbit needs a jax-galsim with a batchable DES_PSFEx (JAX-GalSim
  # PR #261). Until it merges, pin the fork by COMMIT SHA, not branch name.
  backend: "galsim"
  # --- jax-galsim only (ignored by the galsim backend) ---
  # Pinned FFT grid. jit/vmap need static shapes, so there is no per-object
  # sizing and no real_space fallback for compact objects. 256 was validated
  # against galsim at an equivalent multiplicative bias of -2e-05.
  jax_fft_size: 256
  # Objects per batched render. Device memory scales as
  # batch_size * fft_size**2 -- raise one only by lowering the other. A 512
  # batch at fft 512 asked for 116 GiB and OOMed on an otherwise-empty GPU.
  jax_batch_size: 256
  # When the stamps are made.
  #   upfront -> generate the whole dataset before training (default; works with
  #              either backend, and the only mode that can produce the psf_e1 /
  #              psf_e2 / psf_T labels, which need an ngmix fit)
  #   inloop  -> render inside the jitted training step. Fresh noise every step
  #              (a galaxy is never seen twice with the same realisation),
  #              nothing materialised, and the renderer sits in the autodiff
  #              graph so the response terms are one JVP away. Requires
  #              backend: jax-galsim and labels drawn from g1/g2/hlr/flux only.
  generation: "upfront"
  # Render precision is NOT a config key: it follows the process-wide
  # JAX_ENABLE_X64 environment variable, because jax-galsim caches jitted
  # internals without precision in the cache key and toggling the flag at
  # runtime makes a later lowering fail. Export JAX_ENABLE_X64=1 in setup_env.sh
  # for float64 rendering; the in-loop trainer casts stamps to float32 before
  # the network, so that costs nothing in training memory or speed.

# Model configuration  
model:
  process_psf: False
  type: "cnn"  # Options: mlp, cnn, resnet, forklens_psf,
               #          research_backed, fork-like, and d4-fork-like
               #          (D4-equivariant two-branch model, Lin et al. 2026)
  galaxy:
    type: "research_backed"
  psf:
    type: "forklens_psf"
  output_keys: ['g1', 'g2']
  gap: False
  fusion: "concat"  # Options: concat, transformer (fork-like / d4-fork-like only)
  
# Training configuration
training:
  epochs: 10
  batch_size: 32
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  patience: 10
  val_split: 0.2
  eval_interval: 1
  loss: "mse"  # registry name: mse, mae, huber (or one added via register_loss)
  # Exponential moving average of the weights. null = off (default, no change).
  # Set e.g. 0.999 to validate/checkpoint the averaged weights.
  ema_decay: null

# Evaluation configuration
evaluation:
  test_samples: 1000
  seed: 58
  
# Output configuration
output:
  save_path: null  # Will use SHEARNET_DATA_PATH/model_checkpoint if null
  plot_path: null  # Will use SHEARNET_DATA_PATH/plots if null
  model_name: "my_model"
  
# Plotting configuration
plotting:
  plot: true  # Whether to plot learning curves
  
# Comparison methods
comparison:
  mcal: true
  ngmix: true
  psf_model: "gauss"
  gal_model: "gauss"

catalog:
  # Path to a COSMOS catalog FITS file with G1/G2/HLR/FLUX columns. When null (or
  # the file is missing) a synthetic random catalog is used instead, so training
  # works out of the box.
  cosmos_cat_fname: null
